# Run configuration
remove_data: 'True' # Set to True to remove all data in the data directories before running the script

# Directory paths
directories:
  config_dir: 'config'
  audit_dir: 'data/audits'
  eval_dir: 'data/evals'
  http_dir: 'data/http'
  other_dir: 'data/other'
  pdf_dir: 'data/pdfs'
  raw_data_dir: 'data/raw'
  review_dir: 'data/reviews'
  spreadsheet_dir: 'data/spreadsheets'
  summary_dir: 'data/summary_report'

  # Subdirectories for PDF processing
  chunk_dir: 'data/pdfs/chunks'
  rev_json_dir: 'data/reviews/jsons'

# Document Retrieval
## Timer Manager
last_run_timestamp: null # Auto-set to current UTC time after each run (MM/DD/YYYY string)
default_interval_days: 45 # Date range to use if the last_run_timestamp is null

## Download Handler
http_endpoints:
  webfire: 'https://cfpub.epa.gov/webfire'
dl_threads: 6 # Number of CPU threads for concurrent downloading
download_retry_attempts: 5 # Number of download attempts per URL
download_retry_delay_seconds: 2 # Seconds to wait between retry attempts
states: # List of states to download reports for
  - name: 'KS'
  - name: 'MO'
  - name: 'NE'
  - name: 'IA'

## OCR Handler
ocr_jobs_per_file: 4 # Number of OCRmyPDF jobs to use per PDF file
ocr_pdf_renderer: 'sandwich' # Use sandwich to avoid hOCR temp-file failures on some Windows/Tesseract setups

#LLM Review
chunk_size: 1500 # Number of words per chunk for LLM analysis
chunk_overlap: 300 # Number of words to overlap between chunks (to avoid losing context)
audit_chance: 10 # In percent as an integer
llm:
  review: 'gemma4:31b'
  audit: 'gemma4:31b'
llm_url: 'http://localhost:11434/api/chat'
llm_timeout: [5, 600] # Timeout in seconds for LLM requests (connect, read)