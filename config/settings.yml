# Run configuration
remove_data: 'True' # Set to True to remove all data in the data directories before running the script

# Logging
logging:
  level: 'INFO' # DEBUG, INFO, WARNING, ERROR, or CRITICAL
  max_bytes: 5000000 # Rotate the active log after approximately 5 MB
  backup_count: 3 # Number of rotated log files to retain

# Directory paths
directories:
  config_dir: 'config'
  log_dir: 'data/logs'
  audit_dir: 'data/audits'
  eval_dir: 'data/evals'
  http_dir: 'data/http'
  other_dir: 'data/other'
  pdf_dir: 'data/pdfs'
  raw_data_dir: 'data/raw'
  review_dir: 'data/reviews'
  spreadsheet_dir: 'data/spreadsheets'
  summary_dir: 'data/summary_report'
  chunk_dir: 'data/chunks'

# Document Retrieval
## Timer Manager
last_run_timestamp: null # Auto-set to current UTC time after each run (MM/DD/YYYY string)
default_interval_days: 45 # Date range to use if the last_run_timestamp is null

## Download Handler
http_endpoints:
  webfire: 'https://cfpub.epa.gov/webfire'
http_timeout_seconds: 30 # Timeout for each WebFIRE search and report request
download_retry_attempts: 5 # Number of download attempts per URL
download_retry_delay_seconds: 2 # Seconds to wait between retry attempts
download_workers: 4 # Maximum number of concurrent report downloads
states: # List of states to download reports for
  - name: 'KS'
  - name: 'MO'
  - name: 'NE'
  - name: 'IA'

## OCR Handler
ocr_jobs_per_file: 4 # Number of OCRmyPDF jobs to use per PDF file
ocr_pdf_renderer: 'sandwich' # Use sandwich to avoid hOCR temp-file failures on some Windows/Tesseract setups

#LLM Review
chunk_size: 4000 # Number of words per chunk for LLM analysis
chunk_overlap: 300 # Number of words to overlap between chunks (to avoid losing context)
chunk_cap: 10 # Maximum number of chunks to process per document
audit_chance: 10 # In percent as an integer
llm:
  review: 'gemma-4-26b-a4b-it-qat-6bit'
  audit: 'gemma-4-31B-it-qat-6bit'
llm_url: 'http://localhost:11436/v1'
llm_api_key: 'secret_api_key'
llm_timeout: 600 # Timeout in seconds for LLM requests
llm_retries: 3 # Number of retries for LLM requests
