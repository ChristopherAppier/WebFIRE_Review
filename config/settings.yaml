# WebFIRE API configurationapi_endpoints:  webfire:    base_url: "https://cfpub.epa.gov/webfire/reports/"    detail_url: "https://cfpub.epa.gov/webfire/FIRE/view/dspERTDocumentDetails.cfm"    # Timestamp trackinglast_run_timestamp: null # Auto-set to current UTC time after each run (Note for later: ENTER AS MM/DD/YYYY FORMATTED STRING)default_interval_days: 365 # Date range to use if the last_run_timestamp is nulltimestamp_format: "%Y-%m-%dT%H:%M:%SZ" # ISO 8601 UTC formatenable_auto_update: true # Auto-write timestamp after successful runmanual_override_allowed: true # Permit manual timestamp updates if needed# WebFIRE download settingsdl_threads: 5 # Number of CPU threads for concurrent downloadingstates:  - name: "KS"  - name: "MO"  - name: "NE"  - name: "IA"# Directory pathsdirectories:  pdf_dir: "data/pdfs"  spreadsheet_dir: "data/spreadsheets"  audit_dir: "data/audits"  raw_data_dir: "data/raw"  # Audit settingsaudit:  non_compliance_auditor: true # Switch for auditing all non-compliance flagged reports in real time  random_compliance_percentage: 10 # How often reports flagged as in compliance are loaded into the audit file for auditing later  random_spreadsheet_percentage: 10 # How often spreadsheets are analyzed using AI and compared to python analysis    