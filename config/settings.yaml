# Directory pathsdirectories:  pdf_dir: "data/pdfs"  spreadsheet_dir: "data/spreadsheets"  audit_dir: "data/audits"  raw_data_dir: "data/raw"# Document Retrieval## Timer Managerlast_run_timestamp: null # Auto-set to current UTC time after each run (MM/DD/YYYY string)default_interval_days: 365 # Date range to use if the last_run_timestamp is null# Download Handlerapi_endpoints:  webfire:    base_url: "https://cfpub.epa.gov/webfire/reports/"    detail_url: "https://cfpub.epa.gov/webfire/FIRE/view/dspERTDocumentDetails.cfm"dl_threads: 5 # Number of CPU threads for concurrent downloadingstates:  - name: "KS"  - name: "MO"  - name: "NE"  - name: "IA"#AI Reviewchunk_size: 5000chunk_overlap: 100audit_chance: 10 # In percentprompts:  system:    analyze: 'INSERT PROMPT'    audit: 'INSERT PROMPT'ai_models:    analyze: 'qwen3.5:9b'    audit: 'qwen3.5:9b'ai_urls:    analyze: 'http://100.67.89.6:11434/api/chat'    audit: 'http://100.67.89.6:11434/api/chat'    